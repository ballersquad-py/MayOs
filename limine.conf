timeout: 3

/MayOS
    protocol: limine
    path: boot():/boot/kernel
    module_path: boot():/boot/disk.img

/MayOS (safe graphics)
    comment: Use the firmware's screen instead of MayOS's display drivers.
    protocol: limine
    path: boot():/boot/kernel
    module_path: boot():/boot/disk.img
    cmdline: safegraphics

/MayOS (1 CPU)
    comment: Use only the first processor.
    protocol: limine
    path: boot():/boot/kernel
    module_path: boot():/boot/disk.img
    cmdline: nosmp

/MayOS (firmware USB)
    comment: Leave USB to the firmware (use this if the keyboard does not work).
    protocol: limine
    path: boot():/boot/kernel
    module_path: boot():/boot/disk.img
    cmdline: nousb
